services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bilyverse
      POSTGRES_USER: bilyverse
      POSTGRES_PASSWORD: bilyverse
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilyverse -d bilyverse"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
